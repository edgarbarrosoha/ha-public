<!doctype html>
<html lang="es"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sistema de Inteligencia Colectiva de Querétaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
 /* Pantalla de acceso · tarjeta sencilla y centrada (estilo login).
    Deliberadamente sobria: el logo cuadrado y nada más, para NO revelar
    la portada del deck antes de tiempo y preservar el efecto wow. */
 :root{
   --blue:#3673c7;--offset:#2b2d2a;--offwhite:#f4f3f0;
   --ink-3:#8a8d86;--line:rgba(43,45,42,.14);
   --sans:"Instrument Sans","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
 }
 *{margin:0;padding:0;box-sizing:border-box;}
 html,body{height:100%;}
 body{
   background:var(--offset);color:var(--offset);font-family:var(--sans);
   -webkit-font-smoothing:antialiased;
   display:flex;align-items:center;justify-content:center;padding:24px;
 }
 .card{
   width:100%;max-width:440px;background:var(--offwhite);
   border-radius:22px;padding:clamp(36px,5vw,56px) clamp(28px,4vw,44px);
   display:flex;flex-direction:column;align-items:center;text-align:center;
 }
 .logo{display:block;width:104px;height:104px;margin-bottom:36px;}
 .title{font-weight:600;font-size:32px;letter-spacing:-.02em;color:var(--offset);margin-bottom:28px;}
 .form{display:flex;flex-direction:column;gap:14px;width:100%;}
 .field{
   text-align:left;background:#fff;border:1.5px solid var(--line);
   border-radius:14px;padding:12px 18px;transition:border-color .2s ease;
 }
 .field:focus-within{border-color:var(--blue);}
 .field label{display:block;font-size:13px;color:var(--ink-3);margin-bottom:2px;}
 input{
   width:100%;background:transparent;border:0;outline:none;
   color:var(--offset);font-size:18px;font-family:inherit;
 }
 input::placeholder{color:var(--ink-3);}
 button{
   margin-top:6px;background:var(--blue);color:var(--offwhite);border:0;
   border-radius:14px;padding:16px 22px;font-size:18px;font-weight:600;
   font-family:inherit;cursor:pointer;transition:filter .2s ease,transform .2s ease;
 }
 button:hover{filter:brightness(1.07);}
 button:active{transform:translateY(1px);}
 .err{color:#b23b2e;font-weight:500;font-size:14px;margin-top:14px;min-height:18px;}
</style></head><body>
<main class="card">
<img class="logo" src="assets/sicq-cuadrado-trans.svg" alt="SIC-Q" />
<h1 class="title">Acceso restringido</h1>
<form id="f" class="form">
<div class="field"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="off" autofocus /></div>
<button type="submit">Acceder</button>
</form>
<div class="err" id="err"></div>
</main>

<script>
(function(){var P=JSON.parse(document.getElementById('payload').textContent);
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
async function dec(pw){var e=new TextEncoder();var km=await crypto.subtle.importKey('raw',e.encode(pw),'PBKDF2',false,['deriveKey']);
var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},k,b64(P.ct));return new TextDecoder().decode(pt);}
var f=document.getElementById('f'),err=document.getElementById('err');
f.addEventListener('submit',async function(ev){ev.preventDefault();err.textContent='';
try{var h=await dec(document.getElementById('pw').value);document.open();document.write(h);document.close();}
catch(x){err.textContent='Contraseña incorrecta.';document.getElementById('pw').value='';}});})();
</script></body></html>
