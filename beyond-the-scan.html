document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 <div style=\"display:flex;flex-direction:column;gap:36px;\">\n      <h1 style=\"margin:0;font-size:104px;font-weight:400;line-height:1.06;letter-spacing:-0.02em;max-width:1420px;text-wrap:pretty;\">Beyond the scan: executable knowledge networks in philately<\u002Fh1>\n      <p style=\"margin:0;font-size:44px;font-weight:300;line-height:1.24;color:#C2BCB2;max-width:1200px;text-wrap:pretty;\">What changes when a collection can be asked questions<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:28px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.16em;color:#93A6F2;\">\n      <span>EDGAR BARROSO<\u002Fspan><span style=\"color:#4A463F;\">/<\u002Fspan><span style=\"color:#8F8A82;\">HORIZONSARCHITECTURE.AI<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Executable knowledge networks\" data-screen-label=\"02\" data-speaker-notes=\"The idea itself: a record you can ask a question of. Name the dependency out loud — this rests on the catalogue data institutions already hold.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:140px 170px 120px;display:flex;flex-direction:column;gap:44px;\" data-om-slide-id=\"02121c89\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;letter-spacing:0.16em;color:#8F8A82;\">THE IDEA<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:78px;font-weight:400;line-height:1.1;letter-spacing:-0.01em;max-width:1400px;text-wrap:pretty;\">Executable knowledge networks<\u002Fh2>\n    <p style=\"margin:0;font-size:40px;font-weight:300;line-height:1.28;color:#C2BCB2;max-width:1400px;text-wrap:pretty;\">From a folder you open to a record you can ask a question of.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:70px;margin-top:auto;\">\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">THE NODE<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">Stamp, postmark, cancellation, route, rate, treaty: each one can be treated as a data point, not only as part of a picture.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#93A6F2;\">THE NETWORK<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">Linked across collections, those points map about 150 years of postal decisions.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">THE DEPENDENCY<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">The links are only as good as the catalogue data each institution already has.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"The framework\" data-screen-label=\"03\" data-speaker-notes=\"Three problems, not three features. Stress that each institution keeps its own stack.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:120px 170px 100px;display:flex;flex-direction:column;gap:30px;\" data-om-slide-id=\"8e4f1e5b\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;letter-spacing:0.16em;color:#8F8A82;\">THE ARCHITECTURE<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:78px;font-weight:400;line-height:1.1;letter-spacing:-0.01em;max-width:1400px;text-wrap:pretty;\">mira.horizons architecture.ai<\u002Fh2>\n    <p style=\"margin:0;font-size:40px;font-weight:300;line-height:1.28;color:#C2BCB2;max-width:1400px;text-wrap:pretty;\">Three problems that come up first when this has to work across institutions.<\u002Fp>\n    <a href=\"https://mira.horizonsarchitecture.ai\" style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.06em;color:#93A6F2;text-decoration:none;\">mira.horizonsarchitecture.ai<\u002Fa>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:70px;margin-top:auto;\">\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">ORCHESTRATION<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">The Smithsonian, the Royal Philatelic Society and the Vincent Graves Greene run closed legacy databases. Agents crawl and normalise across them, leaving each stack in place.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#93A6F2;\">TRACEABILITY<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">In authentication a plausible guess is not usable. Every inference links back to the exact decree, treaty text or catalogue entry behind it.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">DIVISION OF LABOUR<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">The system does the extraction and graph-building. Historical validation and the final catalogue commit stay with the expert.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Further reading\" data-screen-label=\"04\" data-speaker-notes=\"Point at the written version and move on. Do not read the URL aloud.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:170px 170px 130px;display:flex;flex-direction:column;justify-content:space-between;\" data-om-slide-id=\"ce0dec0e\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;letter-spacing:0.16em;color:#8F8A82;\">WRITTEN UP IN FULL<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:46px;\">\n      <h2 style=\"margin:0;font-size:88px;font-weight:400;line-height:1.08;letter-spacing:-0.02em;max-width:1420px;text-wrap:pretty;\">UPU: lessons for the future<\u002Fh2>\n      <a href=\"https://edgarbarrosoha.github.io/ha-public/upu-lessons-for-the-future.html\" style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:32px;letter-spacing:0.04em;line-height:1.4;color:#93A6F2;text-decoration:none;max-width:1500px;word-break:break-all;\">edgarbarrosoha.github.io/ha-public/upu-lessons-for-the-future.html<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:28px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;letter-spacing:0.16em;color:#93A6F2;\">\n      <span>EDGAR BARROSO<\u002Fspan><span style=\"color:#4A463F;\">/<\u002Fspan><span style=\"color:#8F8A82;\">HORIZONSARCHITECTURE.AI<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Reconstructing transit\" data-screen-label=\"05\" data-speaker-notes=\"Walk the three steps, then land what comes out: a checkable piece of transit history, with the reading's evidence beside it.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:140px 170px 120px;display:flex;flex-direction:column;gap:44px;\" data-om-slide-id=\"ca5ae425\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;letter-spacing:0.16em;color:#8F8A82;\">AN EXAMPLE<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:78px;font-weight:400;line-height:1.1;letter-spacing:-0.01em;max-width:1400px;text-wrap:pretty;\">Reconstructing transit<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:70px;\">\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">INGEST<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">The scan comes in as a set of marked regions, not one flat picture.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">READ<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">Multi-spectral imaging picks up ink the eye can no longer separate.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#93A6F2;\">CROSS-REFERENCE<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">Transit dates are matched against maritime manifests, and against the treaty rates in force that month.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:auto;border-left:2px solid #93A6F2;padding:8px 0 8px 40px;max-width:1500px;\">\n      <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#93A6F2;margin-bottom:18px;\">WHAT COMES OUT<\u002Fdiv>\n      <p style=\"margin:0;font-size:38px;font-weight:300;line-height:1.28;text-wrap:pretty;\">The cover stops being an image and becomes a checkable piece of transit history. Machine reading of nineteenth-century hand stays probabilistic, so each reading comes back with its evidence beside it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Archives as scenario builders\" data-screen-label=\"06\" data-speaker-notes=\"The cost argument. Shell ran scenarios with teams over months; the rejected alternatives sit in minutes and drafts. Frame it as a collapse in cost, not a marginal gain.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:140px 170px 120px;display:flex;flex-direction:column;gap:44px;\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:28px;letter-spacing:0.16em;color:#8F8A82;\">WHAT IT OPENS UP<\u002Fdiv>\n    <h2 style=\"margin:0;font-size:78px;font-weight:400;line-height:1.1;letter-spacing:-0.01em;max-width:1400px;text-wrap:pretty;\">Archives as scenario builders<\u002Fh2>\n    <p style=\"margin:0;font-size:40px;font-weight:300;line-height:1.28;color:#C2BCB2;max-width:1400px;text-wrap:pretty;\">Scenarios anchored in evidence, drawn from material nobody re-reads by hand.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:70px;margin-top:auto;\">\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">THE OLD PRICE<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">Shell ran scenario work with dedicated teams over months. That cost kept the practice rare.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#8F8A82;\">THE MATERIAL<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">The alternatives that were rejected sit in minutes and drafts — read once, then filed.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:22px;border-top:1px solid #3A3733;padding-top:30px;\">\n        <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.16em;color:#93A6F2;\">THE SHIFT<\u002Fdiv>\n        <p style=\"margin:0;font-size:34px;font-weight:300;line-height:1.34;color:#C2BCB2;text-wrap:pretty;\">Building scenarios out of that record reads as a collapse in cost, rather than a marginal gain.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Limits and cautions\" data-screen-label=\"07\" data-speaker-notes=\"Say this part slowly. Bias in the training record, and confidence in the interface — both are design questions.\" style=\"height:100%;background:#EDEAE4;color:#1C1B18;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:150px 170px 130px;display:flex;flex-direction:column;gap:48px;\" data-om-slide-id=\"e3cc9dc3\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.16em;color:#5C574F;\">LIMITS AND CAUTIONS (there are many more)&nbsp;<\u002Fdiv>\n    <div style=\"position:relative;width:100%;height:310px;flex:none;overflow:hidden;background:#DAD4C8;\">\n      <image-slot id=\"v3-hand\" style=\"width:100%;height:100%\" shape=\"rect\" fit=\"cover\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Folded_letter_Warsaw_to_Baden_1866.jpg?width=2400\" credit=\"Folded letter, Warsaw to Baden, 1866 — Wikimedia Commons\" credit-href=\"https://commons.wikimedia.org/wiki/File:Folded_letter_Warsaw_to_Baden_1866.jpg\" placeholder=\"METAPHOR: faded 19th-century hand — the point where reading turns into a likelihood.\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:100px;margin-top:auto;\">\n      <div style=\"display:flex;flex-direction:column;gap:26px;border-top:1px solid #C7C1B6;padding-top:34px;\">\n        <h3 style=\"margin:0;font-size:52px;font-weight:500;line-height:1.12;letter-spacing:-0.01em;text-wrap:pretty;\">Bias in the training record<\u002Fh3>\n        <p style=\"margin:0;font-size:36px;font-weight:300;line-height:1.32;color:#2E2B26;text-wrap:pretty;\">Models learn from the best-documented material, so rare cases and less-documented routes tend to get smoothed over.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:26px;border-top:1px solid #C7C1B6;padding-top:34px;\">\n        <h3 style=\"margin:0;font-size:52px;font-weight:500;line-height:1.12;letter-spacing:-0.01em;color:#3A4FA8;text-wrap:pretty;\">Confidence in the interface<\u002Fh3>\n        <p style=\"margin:0;font-size:36px;font-weight:300;line-height:1.32;color:#2E2B26;text-wrap:pretty;\">A match shown as plain text looks settled. Showing how sure it is, is an interface decision.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Close\" data-screen-label=\"08\" data-speaker-notes=\"The close is about judgment, not citation. Land the line and stop.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;position:relative;overflow:hidden;\" data-om-slide-id=\"dfc10bb7\">\n    <div style=\"position:absolute;inset:0;\">\n      <image-slot id=\"v3-routes\" style=\"width:100%;height:100%\" shape=\"rect\" fit=\"cover\" src=\"https://commons.wikimedia.org/wiki/Special:FilePath/Admiralty_Chart_No_2058_North_Atlantic_Ocean_Route_Chart_showing_variation_curves_for_1905%2C_Published_1901.jpg?width=2400\" credit=\"Admiralty North Atlantic Route Chart, 1901 — Wikimedia Commons\" credit-href=\"https://commons.wikimedia.org/wiki/File:Admiralty_Chart_No_2058_North_Atlantic_Ocean_Route_Chart_showing_variation_curves_for_1905,_Published_1901.jpg\" placeholder=\"METAPHOR: a 19th-century maritime route chart — engraved lines crossing an ocean.\"><\u002Fimage-slot>\n    <\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(28,27,24,0.95) 0%,rgba(28,27,24,0.9) 52%,rgba(28,27,24,0.55) 100%);\"><\u002Fdiv>\n    <div style=\"position:absolute;inset:0;pointer-events:none;padding:170px 170px 120px;display:flex;flex-direction:column;justify-content:space-between;\">\n      <div style=\"display:flex;align-items:baseline;gap:32px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.16em;color:#8F8A82;\">\n        <span>TO CLOSE<\u002Fspan><span style=\"color:#4A463F;\">/<\u002Fspan><span style=\"color:#93A6F2;\">WHERE THE DECISION SITS<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:0;font-size:82px;font-weight:300;line-height:1.14;letter-spacing:-0.01em;max-width:1460px;text-wrap:pretty;\">A scan keeps the object; a network puts its context in front of whoever has to make the call — so the archive ends up holding a record of its own decisions, not only of its objects.<\u002Fp>\n      <div style=\"display:flex;align-items:baseline;gap:28px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.16em;color:#93A6F2;\">\n        <span>EDGAR BARROSO<\u002Fspan><span style=\"color:#4A463F;\">/<\u002Fspan><span style=\"color:#8F8A82;\">HORIZONSARCHITECTURE.AI<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-label=\"Thank you\" data-screen-label=\"09\" data-speaker-notes=\"Leave this up during questions.\" style=\"height:100%;background:#1C1B18;color:#EDEAE4;font-family:'Plus Jakarta Sans',system-ui,sans-serif;padding:170px 170px 130px;display:flex;flex-direction:column;justify-content:space-between;\" data-om-slide-id=\"13701cf5\">\n    <div style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.16em;color:#8F8A82;\">1 SEPTEMBER 2026<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:52px;\">\n      <h2 style=\"margin:0;font-size:112px;font-weight:400;line-height:1.04;letter-spacing:-0.02em;\">Thank you<\u002Fh2>\n      <a href=\"mailto:edgar@horizonsarchitecture.ai\" style=\"font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:52px;letter-spacing:0.01em;color:#93A6F2;text-decoration:none;\">edgar@horizonsarchitecture.ai<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:28px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:30px;letter-spacing:0.16em;color:#93A6F2;\">\n      <span>EDGAR BARROSO<\u002Fspan><span style=\"color:#4A463F;\">/<\u002Fspan><span style=\"color:#8F8A82;\">HORIZONSARCHITECTURE.AI<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fx-import>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
